name: PixelCivilization
options:
  deploymentTarget:
    iOS: "16.0"
  bundleIdPrefix: app.pixelcivilization
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.85.0
targets:
  PixelCivilization:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Game
        excludes: [Info.plist]
      - path: ../generated/web
        name: web
        type: folder
        buildPhase: resources
    configFiles:
      Debug: ../generated/version.xcconfig
      Release: ../generated/version.xcconfig
    dependencies:
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio
        product: NIOHTTP1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pixelcivilization.game
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Game/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  StoreCatalogTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StoreTests
      - path: ../generated/PixelCivilization.storekit
        buildPhase: resources
    dependencies:
      - target: PixelCivilization
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.pixelcivilization.game.storetests
  GameUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Tests]
    dependencies:
      - target: PixelCivilization
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.pixelcivilization.game.uitests
        TEST_TARGET_NAME: PixelCivilization
schemes:
  PixelCivilization:
    build:
      targets:
        PixelCivilization: all
    run:
      config: Debug
      storeKitConfiguration: ../generated/PixelCivilization.storekit
    test:
      targets: [GameUITests, StoreCatalogTests]
    archive:
      config: Release
