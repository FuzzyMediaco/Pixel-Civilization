name: Pixel Civilization Expansion CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/test-expansion.ts"
      - "package.json"
      - ".github/workflows/expansion-ci.yml"
  push:
    branches:
      - "feature/civilization-schools-farms-roads-2026-11"

permissions:
  contents: read

jobs:
  expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript compile checks
        run: npm run lint
      - name: Game build
        run: npm run build
      - name: Simulation regression tests
        run: npm run test:expansion
